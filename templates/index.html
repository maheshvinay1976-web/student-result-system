<!DOCTYPE html>
<html>
<head>
    <title>Student Result System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #2193b0;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #333;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2193b0;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #6dd5ed;
        }
        .links {
            margin-top: 15px;
            text-align: center;
        }
        .links a {
            margin: 0 10px;
            text-decoration: none;
            color: #2193b0;
            font-weight: bold;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Student Marks</h2>
    <form action="/result" method="post">
        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter Student Name" required>

        <label>Mathematics:</label>
        <input type="number" name="s1" placeholder="Marks out of 100" required>

        <label>Physics:</label>
        <input type="number" name="s2" placeholder="Marks out of 100" required>

        <label>Chemistry:</label>
        <input type="number" name="s3" placeholder="Marks out of 100" required>

        <label>English:</label>
        <input type="number" name="s4" placeholder="Marks out of 100" required>

        <label>Computer Science:</label>
        <input type="number" name="s5" placeholder="Marks out of 100" required>

        <button type="submit">Calculate Result</button>
    </form>

    <div class="links">
        <a href="/all">View All Results</a>
    </div>
</div>

</body>
</html>
